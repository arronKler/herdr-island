name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "Scripts/**"
      - ".github/workflows/release.yml"
      - "Sources/IslandApp/AppBrand.swift"
      - "Sources/IslandApp/Resources/**"
      - "Package.*"

permissions:
  contents: read

env:
  SPARKLE_TOOLS_VERSION: "2.10.1"

jobs:
  verify-intel:
    runs-on: macos-15-intel
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Package
        run: Scripts/make-app.sh --version 0.0.0 --build 0

      - name: Smoke the packaged app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/HerdrIsland.app "$RUNNER_TEMP/HerdrIsland.zip"
          # SwiftPM embeds this path as a fallback. It must be unavailable to
          # reproduce a user's installation on a different machine.
          mv .build "$RUNNER_TEMP/island-build-resources"
          python3 Scripts/verify-release.py "$RUNNER_TEMP/HerdrIsland.zip"

  release:
    needs: verify-intel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Package
        run: Scripts/make-release.sh "${GITHUB_REF_NAME#v}"

      - name: Verify the download before publishing
        run: |
          set -euo pipefail
          mv .build "$RUNNER_TEMP/island-build-resources"
          python3 Scripts/verify-release.py "build/release/HerdrIsland-${GITHUB_REF_NAME#v}.zip"

      - name: Build appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tools="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$tools" build/appcast
          curl -fsSL \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz" \
            -o "$tools/sparkle.tar.xz"
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"
          cp "build/release/HerdrIsland-$version.zip" build/appcast/
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://arronkler.github.io/herdr-island/" \
            build/appcast
          cp build/appcast/appcast.xml build/release/appcast.xml

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "build/release/HerdrIsland-$version.zip" \
            "build/release/HerdrIsland-$version.zip.sha256" \
            "build/release/HerdrIsland.zip" \
            "build/release/HerdrIsland.zip.sha256" \
            "build/release/appcast.xml" \
            --title "Herdr Island $version" \
            --generate-notes \
            $prerelease
